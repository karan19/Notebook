<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook iOS Auth Preview</title>
    <style>
        :root {
            /* Light Mode (Soft Stone) */
            --bg-light: #F8F9FA;
            --text-primary-light: #1C1C1E;
            --text-secondary-light: #636366;
            --field-bg-light: #EBEBEB;
            --btn-bg-light: #1C1C1E;
            --btn-text-light: #FFFFFF;

            /* Dark Mode (Deep Slate) */
            --bg-dark: #121212;
            --text-primary-dark: #E5E3DF;
            --text-secondary-dark: #96918E;
            --field-bg-dark: #1C1C1E;
            --btn-bg-dark: #E5E3DF;
            --btn-text-dark: #121212;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Phone Frame */
        .iphone {
            width: 375px;
            height: 812px;
            background-color: var(--bg-light);
            position: relative;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.2);
            border-radius: 40px;
            border: 8px solid #333;
            transition: background-color 0.4s;
        }

        body.dark .iphone {
            background-color: var(--bg-dark);
            border-color: #444;
        }

        /* Splash Screen */
        .splash {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100;
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-in-out, visibility 0.8s, background-color 0.4s;
        }
        body.dark .splash { background-color: var(--bg-dark); }
        .splash.hidden { opacity: 0; visibility: hidden; }

        .logo-text {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--text-primary-light);
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInLogo 1.2s forwards;
        }
        body.dark .logo-text { color: var(--text-primary-dark); }

        @keyframes fadeInLogo {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Login Screen */
        .login {
            padding: 60px 30px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.4s;
            position: relative;
            z-index: 10;
        }

        .login h2 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 8px 0;
            color: var(--text-primary-light);
            letter-spacing: -1px;
        }
        body.dark .login h2 { color: var(--text-primary-dark); }

        .login p {
            font-size: 17px;
            color: var(--text-secondary-light);
            margin: 0 0 40px 0;
        }
        body.dark .login p { color: var(--text-secondary-dark); }

        /* Input Fields */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--text-secondary-light);
            letter-spacing: 0.5px;
        }
        body.dark .input-group label { color: var(--text-secondary-dark); }

        .input-field {
            width: 100%;
            height: 54px;
            background-color: var(--field-bg-light);
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 17px;
            color: var(--text-primary-light);
            outline: none;
            transition: background-color 0.2s;
        }
        body.dark .input-field {
            background-color: var(--field-bg-dark);
            color: var(--text-primary-dark);
        }

        /* Button */
        .btn-primary {
            width: 100%;
            height: 54px;
            background-color: var(--btn-bg-light);
            color: var(--btn-text-light);
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        body.dark .btn-primary {
            background-color: var(--btn-bg-dark);
            color: var(--btn-text-dark);
        }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

        .secondary-links {
            margin-top: 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary-light);
            text-decoration: none;
            cursor: pointer;
        }
        body.dark .link { color: var(--text-secondary-dark); }

        /* Controls */
        .controls {
            position: fixed;
            left: 20px;
            top: 40px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            font-weight: 600;
        }

        .noise-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 1000;
        }
    </style>
</head>
<body class="light">
    
    <div class="controls">
        <button class="control-btn" onclick="toggleTheme()">Toggle Theme</button>
        <button class="control-btn" onclick="replaySplash()">Replay Splash</button>
    </div>

    <div class="iphone">
        <div class="noise-overlay"></div>
        
        <!-- Splash Screen Overlay -->
        <div class="splash" id="splash">
            <div class="logo-text">Notebook</div>
        </div>

        <!-- Login Screen -->
        <div class="login">
            <h2>Welcome Back.</h2>
            <p>Enter your credentials to continue your story.</p>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" class="input-field" placeholder="email@example.com" />
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" class="input-field" placeholder="••••••••" />
            </div>

            <button class="btn-primary" onclick="alert('Proceeding to Dashboard...')">Sign In</button>
        </div>
    </div>

    <script>
        // Automatic splash transition
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').classList.add('hidden');
            }, 2500);
        });

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }

        function replaySplash() {
            const splash = document.getElementById('splash');
            splash.classList.remove('hidden');
            setTimeout(() => {
                splash.classList.add('hidden');
            }, 2500);
        }
    </script>
</body>
</html>
